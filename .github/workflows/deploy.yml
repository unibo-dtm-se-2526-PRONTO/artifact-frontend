name: deploy
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  # semantic-release comments on the issues and pull requests a release ships
  issues: write
  pull-requests: write
jobs:
  release:
    name: Release
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history

      - name: Get All Tags
        run: git fetch --tags -f

      - name: Dry-run Release for Initial Commit
        id: skip_release
        run: |
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # QEMU emulates arm64 on the amd64 runner, so buildx can build both
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The release pushes the Docker image to GHCR with the run's token,
      # which packages: write above allows. Only real releases push.
      - name: Log in to GHCR
        if: github.ref_name == 'master' || github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # dist/ is what the npm package ships (package.json "files").
      - name: Release
        shell: bash
        run: |
          npm ci
          npm run build-only
          npx semantic-release
        env:
          # Granular access token from npmjs.com, with read and write access
          # to packages; only real releases use it.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The token Actions generates for every run, so no personal token can
          # expire: tag and GitHub release come from github-actions[bot], the
          # release commit from semantic-release-bot. Its pushes start no
          # other workflow, which the release commit skips anyway ([skip ci]).
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: ${{ steps.skip_release.outputs.skip == 'true' || (github.ref_name != 'master' && github.ref_name != 'main') }}
